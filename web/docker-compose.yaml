services:
  web:
    image: ${WEB_IMAGE:-dr.dmomo.net/damho1104/synonote-web:0.4.0}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8787}:8080"
    environment:
      TZ: Asia/Seoul
      NAS_URL: ${NAS_URL:-}
      NAS_ALLOW_PRIVATE: ${NAS_ALLOW_PRIVATE:-false}
      NAS_CA_FILE: ${NAS_CA_FILE:-}
    volumes:
      - ${WEB_DATA_PATH:-synonote-web-data}:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  synonote-web-data:
