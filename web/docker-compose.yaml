services:
  web:
    # Public image published to GHCR by GitHub Actions; no local build needed.
    image: ${WEB_IMAGE:-ghcr.io/damho1104/synology-md-note-web:latest}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8787}:8080"
    environment:
      TZ: Asia/Seoul
      # Optional: blank NAS_URL opens the initial web setup screen.
      NAS_URL: ${NAS_URL:-}
      # Set true only for a private LAN address or HTTP NAS connection.
      NAS_ALLOW_PRIVATE: ${NAS_ALLOW_PRIVATE:-false}
      # Optional: private CA only; also uncomment the read-only mount below.
      NAS_CA_FILE: ${NAS_CA_FILE:-}
      WEB_DEFAULT_LANGUAGE: ${WEB_DEFAULT_LANGUAGE:-auto}
      # Advanced proxy settings; ordinary installations use these defaults.
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-auto}
    volumes:
      - ${WEB_DATA_PATH:-synonote-web-data}:/data
      # Optional: uncomment only when your NAS needs a private CA.
      # Set NAS_CA_FILE=/etc/synonote/nas-ca.pem in .env as well.
      # - type: bind
      #   source: ./certs/nas-ca.pem
      #   target: /etc/synonote/nas-ca.pem
      #   read_only: true
      #   bind:
      #     create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  synonote-web-data:
