[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "synonote-cli"
version = "1.2.32"
description = "Safe Markdown CLI for Synology Note Station"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13.18,<3.14"
dependencies = ["typer>=0.15,<1", "httpx>=0.27,<1", "certifi>=2026.10.19", "keyring>=25,<27", "markdown-it-py>=3,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
synonote = "synonote_cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/synonote_cli"]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "entrypoint.py", "build_onefile.py", "hatch_build.py", "README.md", "LICENSE", "pyproject.toml", "uv.lock", ".python-version"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.pytest_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
