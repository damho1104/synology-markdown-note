name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: [self-hosted, Linux, X64, docker-compose]
    container: buildpack-deps:noble-curl
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install version validation tools
        run: |
          find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -Ei 's#https?://(archive|security)\.ubuntu\.com/ubuntu#https://mirror.kakao.com/ubuntu#g' {} +
          apt-get update --error-on=any
          apt-get install -y --no-install-recommends ca-certificates git python3
      - uses: actions/checkout@v4
      - name: Verify release source branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 script/check_release_source.py \
            --event "$GITHUB_EVENT_NAME" --ref-type "$GITHUB_REF_TYPE" --ref-name "$GITHUB_REF_NAME"
      - id: version
        name: Validate release tag against project version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          base=$(python3 script/version_info.py --base)
          tag="v$base"
          if [[ "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; fi
          version=$(SYNOLOGY_NOTE_RELEASE_TAG="$tag" python3 script/version_info.py)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: [self-hosted, Linux, X64, docker-compose]
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    # The container selects the build's libc/userland, independently of the host.
    container: buildpack-deps:${{ matrix.ubuntu }}-curl
    defaults:
      run:
        shell: bash
    env:
      SYNOLOGY_NOTE_RELEASE_TAG: ${{ needs.version.outputs.tag }}
      PLATFORM: ubuntu-${{ matrix.ubuntu }}-amd64
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Install build tools in the target Ubuntu environment
        run: |
          find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -Ei 's#https?://(archive|security)\.ubuntu\.com/ubuntu#https://mirror.kakao.com/ubuntu#g' {} +
          apt-get update --error-on=any
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential binutils
          source /etc/os-release
          test "$VERSION_ID" = "$UBUNTU_VERSION"
          test "$(uname -m)" = x86_64
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock
      - name: Test and build CLI
        working-directory: cli
        run: |
          uv python install
          uv lock --check
          uv run --locked pytest -q tests
          uv run --locked python build_onefile.py
      - name: Smoke test and stage release assets
        run: |
          uv run --project cli --locked python script/release_assets.py \
            --tag "$SYNOLOGY_NOTE_RELEASE_TAG" --platform "$PLATFORM" \
            --cli cli/dist/synonote --output release-assets
          cd release-assets
          sha256sum --check "SHA256SUMS-$PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.PLATFORM }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  linux-portable:
    needs: version
    runs-on: [self-hosted, Linux, X64, docker-compose]
    container: quay.io/pypa/manylinux_2_28_x86_64:latest
    env:
      SYNOLOGY_NOTE_RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Test and build portable Linux x86_64 CLI on glibc 2.28
        run: bash script/build_linux_portable.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-glibc2.28-amd64
          path: .build/release-assets/linux-glibc2.28-amd64/*
          if-no-files-found: error
          retention-days: 7

  linux-compatibility:
    needs: [version, linux-portable]
    runs-on: [self-hosted, Linux, X64, docker-compose]
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:11-slim
          - debian:12-slim
          - debian:13-slim
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - almalinux:8
          - almalinux:9
          - rockylinux:8
          - rockylinux:9
          - fedora:43
          - opensuse/leap:16.0
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      TEST_IMAGE: ${{ matrix.image }}
    steps:
      - name: Restore workspace ownership after container builds
        run: sudo chown -R --no-dereference "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-glibc2.28-amd64
          path: .build/linux-compatibility
      - name: Verify frozen CLI in a clean distribution without Python
        run: |
          cd .build/linux-compatibility
          sha256sum --check SHA256SUMS-linux-glibc2.28-amd64
          chmod +x "synonote-cli-$RELEASE_TAG-linux-glibc2.28-amd64"
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/test:ro" \
            "$TEST_IMAGE" sh /test/script/smoke_linux_binary.sh \
            "/test/.build/linux-compatibility/synonote-cli-$RELEASE_TAG-linux-glibc2.28-amd64" \
            "$RELEASE_VERSION"

  macos:
    needs: version
    runs-on: [self-hosted, macOS, ARM64]
    env:
      SYNOLOGY_NOTE_RELEASE_TAG: ${{ needs.version.outputs.tag }}
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock
      - name: Select managed Python for build scripts
        working-directory: cli
        run: |
          uv python install
          echo "$(dirname "$(uv python find)")" >> "$GITHUB_PATH"
      - name: Verify arm64 runner and test Swift
        run: |
          test "$(uname -m)" = arm64
          ./script/test.sh
      - name: Test and build CLI
        working-directory: cli
        run: |
          uv lock --check
          uv run --locked pytest -q tests
          uv run --locked python build_onefile.py
      - name: Import dedicated release signing identity
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MACOS_SIGNING_CERT_SHA1: ${{ secrets.MACOS_SIGNING_CERT_SHA1 }}
        run: python3 script/ci_signing.py
      - name: Build signed app and verify DMG and ZIP
        run: |
          python3 script/build_credential_helper.py
          ./script/package_app.sh --build --output "$RUNNER_TEMP/app-package-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Smoke test and stage release assets
        run: |
          python3 script/release_assets.py \
            --tag "$SYNOLOGY_NOTE_RELEASE_TAG" --platform macos-arm64 \
            --cli cli/dist/synonote --app-package "$RUNNER_TEMP/app-package-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output release-assets
          cd release-assets
          shasum -a 256 --check SHA256SUMS-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing keychain
        if: always()
        run: python3 script/ci_signing.py cleanup

  web-checks:
    needs: version
    uses: ./.github/workflows/web-checks.yml

  web-image:
    needs: [version, web-checks, linux, linux-compatibility, macos]
    runs-on: [self-hosted, Linux, X64, docker-compose]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Restore workspace ownership after container tests
        run: sudo chown -R --no-dereference "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: image
        name: Set GHCR image name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/synology-md-note-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify published platforms
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --raw > "$RUNNER_TEMP/web-manifest.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'web-manifest.json').read_text())
          platforms = {(item.get('platform', {}).get('os'), item.get('platform', {}).get('architecture'))
                       for item in manifest.get('manifests', [])}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, platforms
          PY

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, linux, linux-compatibility, macos, web-image]
    runs-on: [self-hosted, Linux, X64, docker-compose]
    container: buildpack-deps:noble-curl
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Install publishing tools
        run: |
          find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -Ei 's#https?://(archive|security)\.ubuntu\.com/ubuntu#https://mirror.kakao.com/ubuntu#g' {} +
          apt-get update --error-on=any
          apt-get install -y --no-install-recommends ca-certificates gh jq
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete asset set and checksums
        working-directory: release-assets
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          for platform in ubuntu-22.04-amd64 ubuntu-24.04-amd64 linux-glibc2.28-amd64 macos-arm64; do
            test -s "synonote-cli-$RELEASE_TAG-$platform"
            sha256sum --check "SHA256SUMS-$platform"
          done
          test -s "SynologyMarkdownNote-$RELEASE_VERSION-arm64.dmg"
          test -s "SynologyMarkdownNote-$RELEASE_VERSION-arm64.zip"
      - name: Upload all assets to a draft, then publish
        run: |
          # Resume an interrupted draft; never replace an already published release.
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2> release-error.txt; then
            test "$(jq -r .isDraft release.json)" = true
          else
            # Creation fails safely if the tag is missing or the API is unavailable.
            gh release create "$RELEASE_TAG" --verify-tag --target main --draft \
              --title "$RELEASE_TAG" --generate-notes \
              --notes 'macOS arm64 app and CLI; Linux x86_64 glibc 2.28+ CLI tested on Debian, Ubuntu, AlmaLinux, Rocky Linux, Fedora and openSUSE; Ubuntu 22.04/24.04 amd64 CLI. macOS app uses a dedicated self-signed release certificate and is not Apple notarized. See distribution.ko.md and SHA256SUMS-*.'
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
