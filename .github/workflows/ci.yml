name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: [self-hosted, Linux, X64, docker-compose]
    container: ubuntu:24.04
    steps:
      - name: Install container build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential binutils
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock
      - name: Test CLI
        working-directory: cli
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv python install 3.13
          uv lock --check
          uv run --locked pytest -q tests

  swift:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift
        run: |
          swift --version
          ./script/test.sh
