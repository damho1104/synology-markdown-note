name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    uses: ./.github/workflows/web-checks.yml

  cli:
    # Untrusted PR code runs only on GitHub-hosted infrastructure.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "docker-compose"]') }}
    container: ubuntu:24.04
    steps:
      - name: Install container build tools
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) \
              -exec sed -Ei 's#http://(archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu#http://mirror.kakao.com/ubuntu#g' {} +
          fi
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential binutils
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: ${{ github.event_name != 'pull_request' }}
          cache-dependency-glob: cli/uv.lock
      - name: Test and build CLI
        working-directory: cli
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv python install
          uv lock --check
          uv run --locked pytest -q tests
          uv run --locked python build_onefile.py

  swift:
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-latest' || fromJSON('["self-hosted", "macOS", "ARM64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test Swift
        run: |
          swift --version
          ./script/test.sh --no-parallel
      - name: Build Swift release configuration
        run: ./script/swift.sh build -c release
